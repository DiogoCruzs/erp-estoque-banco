{% extends 'base.html' %}{% block content %}<div class="sale-layout"><section><div class="sale-toolbar"><input id="product-search" placeholder="Buscar espeto..."><span class="muted">Clique em +1, +2 ou +5</span></div><div class="product-grid" id="product-grid">{% for p in products %}<article class="product-card" data-name="{{ p.name|lower }}"><div><h3>{{ p.name }}</h3><span class="stock-tag {% if p.stock_qty<=p.min_stock %}low{% endif %}">Estoque {{ p.stock_qty }}</span></div><strong>{{ p.sale_price_cents|brl }}</strong><div class="product-actions"><button data-add="{{ p.id }}" data-qty="1">+1</button><button data-add="{{ p.id }}" data-qty="2">+2</button><button data-add="{{ p.id }}" data-qty="5">+5</button><input data-manual="{{ p.id }}" type="number" min="1" placeholder="qtd"></div></article>{% endfor %}</div></section><aside class="cart panel"><div class="panel-head"><h2>Carrinho</h2><span id="cart-count">0 espetos</span></div><div id="cart-items"><p class="empty">Adicione produtos para iniciar.</p></div><div class="cart-total"><span>Total</span><strong id="cart-total">R$ 0,00</strong></div><button class="btn full" id="finish-sale">FINALIZAR VENDA</button></aside></div>{% endblock %}
