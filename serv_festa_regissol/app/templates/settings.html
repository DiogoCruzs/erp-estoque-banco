{% extends 'base.html' %}{% block content %}<section class="panel"><div class="panel-head"><h2>Configurações</h2><span>ajustes simples para o uso diário</span></div><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-grid"><label>Nome do estabelecimento<input name="establishment_name" value="{{ settings.establishment_name }}"></label><label>Meta diária<input name="daily_goal" type="number" min="0" value="{{ settings.daily_goal }}"></label><label>Dias da média móvel<input name="moving_average_days" type="number" min="1" max="90" value="{{ settings.moving_average_days }}"></label><label>Alerta amarelo (% do mínimo)<input name="yellow_alert_percent" type="number" min="0" max="100" value="{{ settings.yellow_alert_percent }}"></label><label>Frequência de backup<select name="backup_frequency"><option value="daily" {% if settings.backup_frequency=='daily' %}selected{% endif %}>Diário</option><option value="manual" {% if settings.backup_frequency=='manual' %}selected{% endif %}>Somente manual</option></select></label></div><button class="btn">SALVAR CONFIGURAÇÕES</button></form></section><section class="panel"><div class="panel-head"><h2>Backup local</h2><span>mantém os últimos 30 arquivos</span></div><p class="muted">O banco fica na pasta <code>data/serv_festa.db</code>. Backups ficam em <code>data/backups/</code>.</p><form method="post" action="{{ url_for('main.backup') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn secondary">FAZER BACKUP AGORA</button></form></section>{% endblock %}
