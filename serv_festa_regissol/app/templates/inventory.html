{% extends 'base.html' %}{% block content %}<section class="panel"><div class="panel-head"><h2>Contagem de estoque</h2><span>o sistema nunca substitui silenciosamente a quantidade</span></div><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="table-wrap"><table><thead><tr><th>Produto</th><th>Sistema</th><th>Contagem física</th><th>Diferença</th></tr></thead><tbody>{% for p in products %}<tr><td>{{ p.name }}</td><td>{{ p.stock_qty }}</td><td><input class="physical-input" data-system="{{ p.stock_qty }}" name="physical_{{ p.id }}" type="number" min="0" value="{{ p.stock_qty }}"></td><td class="diff-cell">0</td></tr>{% endfor %}</tbody></table></div><label>Observação<textarea name="notes" rows="2"></textarea></label><button class="btn">APLICAR INVENTÁRIO</button></form></section>{% endblock %}
